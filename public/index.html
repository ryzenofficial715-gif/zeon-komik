<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeon Komik — Baca Komik Gratis</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <style>
        :root { --bg:#000a1a; --panel:#001030; --border:#002255; --text:#ddeeff; --dim:#4a80b8; --accent:#1e90ff; --accent2:#00bfff; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Poppins',sans-serif; min-height:100vh; }
        .navbar { background:rgba(0,10,30,0.9); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; flex-wrap:wrap; gap:10px; }
        .navbar .logo { font-family:'Orbitron',monospace; font-size:1.3rem; font-weight:900; background:linear-gradient(135deg, var(--accent2), var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent; }
        .navbar .nav-links { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
        .navbar a, .navbar .nav-btn { color:var(--dim); text-decoration:none; font-size:0.8rem; font-weight:600; transition:color 0.2s; cursor:pointer; background:none; border:none; font-family:'Poppins',sans-serif; }
        .navbar a:hover, .navbar .nav-btn:hover { color:var(--accent2); }
        .btn-login { background:var(--accent); color:white; border:none; padding:8px 16px; border-radius:20px; font-weight:600; cursor:pointer; font-size:0.75rem; font-family:'Poppins',sans-serif; }
        .btn-logout { background:transparent; color:var(--dim); border:1px solid var(--border); padding:6px 12px; border-radius:15px; cursor:pointer; font-size:0.7rem; font-family:'Poppins',sans-serif; }
        .search-bar { padding:20px; max-width:600px; margin:0 auto; }
        .search-bar input { width:100%; padding:14px 20px; border-radius:25px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:0.9rem; outline:none; font-family:'Poppins',sans-serif; }
        .search-bar input:focus { border-color:var(--accent2); }
        .container { max-width:1200px; margin:0 auto; padding:20px; }
        .section-title { font-family:'Orbitron',monospace; font-size:1.1rem; font-weight:700; letter-spacing:2px; color:var(--accent2); margin-bottom:20px; }
        .komik-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:16px; }
        .komik-card { background:var(--panel); border:1px solid var(--border); border-radius:16px; overflow:hidden; cursor:pointer; transition:all 0.3s; text-decoration:none; color:var(--text); display:block; }
        .komik-card:hover { border-color:var(--accent2); transform:translateY(-4px); box-shadow:0 10px 30px rgba(0,180,255,0.2); }
        .komik-card img { width:100%; aspect-ratio:3/4; object-fit:cover; background:#001030; }
        .komik-card .info { padding:10px 12px; }
        .komik-card .title { font-size:0.8rem; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.3; }
        .loading { text-align:center; padding:40px; color:var(--dim); }
        .genre-modal { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,15,0.9); justify-content:center; align-items:center; padding:20px; }
        .genre-modal.open { display:flex; }
        .genre-box { background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:30px; max-width:600px; width:100%; max-height:80vh; overflow-y:auto; position:relative; }
        .genre-box h2 { font-family:'Orbitron',monospace; color:var(--accent2); margin-bottom:20px; }
        .genre-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px; }
        .genre-tag { background:var(--bg); border:1px solid var(--border); padding:10px; border-radius:10px; text-align:center; cursor:pointer; font-size:0.8rem; transition:all 0.2s; color:var(--text); text-decoration:none; }
        .genre-tag:hover { border-color:var(--accent2); background:rgba(0,180,255,0.1); }
        .genre-close { position:absolute; top:15px; right:20px; background:none; border:none; color:var(--dim); font-size:1.5rem; cursor:pointer; }
        .footer { text-align:center; padding:30px; color:var(--dim); font-size:0.7rem; border-top:1px solid var(--border); margin-top:40px; }
        .footer a { color:var(--accent2); text-decoration:none; }
        @media (max-width:600px) { .komik-grid { grid-template-columns:repeat(3, 1fr); gap:10px; } .komik-card .title { font-size:0.7rem; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">📚 ZEON KOMIK</div>
        <div class="nav-links">
            <button class="nav-btn" onclick="openGenres()">🎭 Genre</button>
            <a href="/bookmarks" id="linkBookmarks" style="display:none">🔖 Bookmark</a>
            <a href="/about">About</a>
            <button id="btnLogin" class="btn-login" onclick="loginGoogle()">Login Google</button>
            <div id="userInfo" style="display:none;align-items:center;gap:8px;">
                <img id="userAvatar" src="" style="width:28px;height:28px;border-radius:50%">
                <span id="userName" style="font-size:0.75rem"></span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Cari komik..." onkeydown="if(event.key==='Enter')searchKomik()">
    </div>

    <div class="container">
        <div class="section-title">🔥 POPULER</div>
        <div class="komik-grid" id="komikGrid"></div>
        <div class="loading" id="loading">Loading...</div>
    </div>

    <div class="genre-modal" id="genreModal">
        <div class="genre-box">
            <button class="genre-close" onclick="closeGenres()">&times;</button>
            <h2>🎭 Genre</h2>
            <div class="genre-grid" id="genreGrid">Loading...</div>
        </div>
    </div>

    <div class="footer">© 2026 <strong>Zeon Komik</strong> — Created by <a href="/about">Ryzen Official</a></div>

    <script>
        const firebaseConfig = { apiKey:"AIzaSyA3lMBhYIjeZSMhLyYbgKRnCCQWyA-yg8s", authDomain:"zeon-komik.firebaseapp.com", projectId:"zeon-komik", storageBucket:"zeon-komik.firebasestorage.app", messagingSenderId:"542220756538", appId:"1:542220756538:web:8facd06a688b19e48f3703" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            document.getElementById('btnLogin').style.display = user ? 'none' : 'inline-block';
            document.getElementById('userInfo').style.display = user ? 'flex' : 'none';
            document.getElementById('linkBookmarks').style.display = user ? 'inline' : 'none';
            if (user) {
                document.getElementById('userAvatar').src = user.photoURL || '';
                document.getElementById('userName').textContent = user.displayName || 'User';
            }
        });

        auth.getRedirectResult().then(r => { if (r && r.user) location.reload(); }).catch(() => {});

        function loginGoogle() { 
            const p = new firebase.auth.GoogleAuthProvider();
            p.setCustomParameters({ prompt: 'select_account' });
            auth.signInWithPopup(p).catch(() => auth.signInWithRedirect(p));
        }
        function logout() { auth.signOut(); }

        async function loadHome() {
            const grid = document.getElementById('komikGrid');
            const load = document.getElementById('loading');
            try {
                const r = await fetch('/api/home');
                const d = await r.json();
                if (d.success && d.data.length) {
                    grid.innerHTML = d.data.map(k => `<a href="/detail?url=${encodeURIComponent(k.url)}&title=${encodeURIComponent(k.title)}" class="komik-card">${k.thumbnail ? `<img src="${k.thumbnail}" alt="${k.title}" onerror="this.style.display='none'">` : ''}<div class="info"><div class="title">${k.title}</div></div></a>`).join('');
                } else { grid.innerHTML = '<div class="loading">Gagal memuat komik.</div>'; }
            } catch(e) { grid.innerHTML = '<div class="loading">Gagal memuat.</div>'; }
            load.style.display = 'none';
        }

        function searchKomik() {
            const q = document.getElementById('searchInput').value.trim();
            if (q) window.location.href = '/search?q=' + encodeURIComponent(q);
        }

        async function openGenres() {
            document.getElementById('genreModal').classList.add('open');
            const grid = document.getElementById('genreGrid');
            try {
                const r = await fetch('/api/genres');
                const d = await r.json();
                if (d.success) grid.innerHTML = d.data.map(g => `<a href="/genre?url=${encodeURIComponent(g.url)}&name=${encodeURIComponent(g.name)}" class="genre-tag">${g.name}</a>`).join('');
            } catch(e) { grid.innerHTML = 'Gagal memuat.'; }
        }
        function closeGenres() { document.getElementById('genreModal').classList.remove('open'); }

        loadHome();
    </script>
</body>
</html>
