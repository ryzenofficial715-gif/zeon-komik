<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail — Zeon Komik</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <style>
        :root { --bg:#000a1a; --panel:#001030; --border:#002255; --text:#ddeeff; --dim:#4a80b8; --accent:#1e90ff; --accent2:#00bfff; --red:#ff6b6b; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Poppins',sans-serif; min-height:100vh; }
        .navbar { background:rgba(0,10,30,0.9); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
        .navbar .logo { font-family:'Orbitron',monospace; font-size:1.2rem; font-weight:900; background:linear-gradient(135deg, var(--accent2), var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent; }
        .navbar a { color:var(--dim); text-decoration:none; font-size:0.8rem; font-weight:600; }
        .navbar a:hover { color:var(--accent2); }
        .container { max-width:900px; margin:0 auto; padding:20px; }
        .detail-header { display:flex; gap:20px; margin-bottom:30px; flex-wrap:wrap; }
        .detail-header img { width:180px; aspect-ratio:3/4; object-fit:cover; border-radius:16px; border:1px solid var(--border); background:var(--panel); }
        .detail-header .info { flex:1; min-width:200px; }
        .detail-header .title { font-family:'Orbitron',monospace; font-size:1.4rem; font-weight:700; color:var(--accent2); margin-bottom:10px; }
        .detail-header .sinopsis { font-size:0.85rem; color:var(--dim); line-height:1.6; margin-bottom:15px; max-height:150px; overflow-y:auto; }
        .actions { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
        .btn { padding:10px 20px; border-radius:10px; border:none; cursor:pointer; font-weight:700; font-size:0.8rem; transition:all 0.2s; text-decoration:none; display:inline-block; font-family:'Poppins',sans-serif; }
        .btn-read { background:linear-gradient(135deg, var(--accent), var(--accent2)); color:white; }
        .btn-read:hover { filter:brightness(1.2); }
        .btn-bookmark { background:var(--panel); color:var(--accent2); border:1px solid var(--border); }
        .btn-bookmark.active { background:rgba(0,180,255,0.2); border-color:var(--accent2); }
        .btn-back { background:transparent; color:var(--dim); border:1px solid var(--border); }
        .section-title { font-family:'Orbitron',monospace; font-size:1rem; font-weight:700; letter-spacing:1px; color:var(--accent2); margin-bottom:15px; margin-top:30px; }
        .chapter-list { display:flex; flex-direction:column; gap:6px; max-height:500px; overflow-y:auto; }
        .chapter-item { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; transition:all 0.2s; text-decoration:none; color:var(--text); }
        .chapter-item:hover { border-color:var(--accent2); background:rgba(0,180,255,0.05); }
        .chapter-item .ch-title { font-size:0.85rem; font-weight:500; }
        .react-bar { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
        .react-btn { background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:8px 16px; cursor:pointer; font-size:0.85rem; transition:all 0.2s; color:var(--text); display:flex; align-items:center; gap:6px; font-family:'Poppins',sans-serif; }
        .react-btn:hover { border-color:var(--accent2); }
        .react-btn.active { background:rgba(0,180,255,0.2); border-color:var(--accent2); }
        .comment-input { display:flex; gap:10px; margin-bottom:20px; }
        .comment-input input { flex:1; padding:12px; border-radius:12px; border:1px solid var(--border); background:var(--panel); color:var(--text); outline:none; font-family:'Poppins',sans-serif; }
        .comment-input input:focus { border-color:var(--accent2); }
        .comment-input button { padding:10px 20px; border-radius:12px; border:none; background:var(--accent); color:white; font-weight:700; cursor:pointer; font-family:'Poppins',sans-serif; }
        .comment-item { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:8px; }
        .comment-item .c-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
        .comment-item .c-avatar { width:28px; height:28px; border-radius:50%; }
        .comment-item .c-name { font-weight:600; font-size:0.8rem; }
        .comment-item .c-date { font-size:0.65rem; color:var(--dim); }
        .comment-item .c-text { font-size:0.85rem; }
        .loading { text-align:center; padding:40px; color:var(--dim); }
        .footer { text-align:center; padding:30px; color:var(--dim); font-size:0.7rem; border-top:1px solid var(--border); margin-top:40px; }
        .footer a { color:var(--accent2); text-decoration:none; }
        @media (max-width:600px) { .detail-header img { width:140px; } .detail-header .title { font-size:1.1rem; } }
    </style>
</head>
<body>
    <nav class="navbar"><div class="logo">📚 ZEON KOMIK</div><a href="/">Home</a></nav>
    <div class="container" id="content"><div class="loading" id="loading">Loading...</div></div>
    <div class="footer">© 2026 <strong>Zeon Komik</strong> — Created by <a href="/about">Ryzen Official</a></div>

    <script>
        const params = new URLSearchParams(location.search);
        const komikUrl = params.get('url');
        const komikTitle = params.get('title') || '';

        const firebaseConfig = { apiKey:"AIzaSyA3lMBhYIjeZSMhLyYbgKRnCCQWyA-yg8s", authDomain:"zeon-komik.firebaseapp.com", projectId:"zeon-komik", storageBucket:"zeon-komik.firebasestorage.app", messagingSenderId:"542220756538", appId:"1:542220756538:web:8facd06a688b19e48f3703" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let currentUser = null;
        auth.onAuthStateChanged(u => { currentUser = u; if (u) document.getElementById('commentInput') && (document.getElementById('commentInput').style.display = 'flex'); });

        async function loadDetail() {
            const content = document.getElementById('content');
            const load = document.getElementById('loading');
            try {
                const r = await fetch('/api/detail?url=' + encodeURIComponent(komikUrl));
                const d = await r.json();
                if (d.success) {
                    const k = d.data;
                    const isBm = await isBookmark(komikUrl);
                    content.innerHTML = `
                        <a href="/" class="btn btn-back" style="margin-bottom:20px">⬅ Kembali</a>
                        <div class="detail-header">
                            ${k.thumbnail ? `<img src="${k.thumbnail}" alt="${k.title}" onerror="this.style.display='none'">` : ''}
                            <div class="info">
                                <h1 class="title">${k.title}</h1>
                                <div class="sinopsis">${k.synopsis || 'Tidak ada sinopsis.'}</div>
                                <div class="actions">
                                    <a href="/read?url=${encodeURIComponent(komikUrl)}&title=${encodeURIComponent(k.title)}" class="btn btn-read">📖 Baca Chapter 1</a>
                                    <button class="btn btn-bookmark ${isBm ? 'active' : ''}" id="bookmarkBtn" onclick="toggleBookmark()">${isBm ? '🔖 Bookmarked' : '🔖 Bookmark'}</button>
                                </div>
                            </div>
                        </div>
                        <div class="section-title">📋 DAFTAR CHAPTER (${k.chapters.length})</div>
                        <div class="chapter-list">${k.chapters.map(ch => `<a href="/read?url=${encodeURIComponent(komikUrl)}&title=${encodeURIComponent(k.title)}&ch=${encodeURIComponent(ch.url)}" class="chapter-item"><span class="ch-title">${ch.title}</span></a>`).join('')}</div>
                        <div class="section-title">💬 REACT & KOMENTAR</div>
                        <div class="react-bar" id="reactBar">
                            <button class="react-btn" onclick="sendReact('like')">👍 <span id="count-like">0</span></button>
                            <button class="react-btn" onclick="sendReact('love')">❤️ <span id="count-love">0</span></button>
                            <button class="react-btn" onclick="sendReact('fire')">🔥 <span id="count-fire">0</span></button>
                        </div>
                        <div class="comment-input" id="commentInput" style="display:none">
                            <input type="text" id="commentText" placeholder="Tulis komentar..." onkeydown="if(event.key==='Enter')sendComment()">
                            <button onclick="sendComment()">Kirim</button>
                        </div>
                        <div id="commentList"></div>
                    `;
                    loadComments();
                } else { content.innerHTML = '<p style="color:var(--red);text-align:center">Gagal memuat.</p>'; }
            } catch(e) { content.innerHTML = '<p style="color:var(--red);text-align:center">Gagal memuat.</p>'; }
            load.style.display = 'none';
        }

        async function isBookmark(url) {
            if (!currentUser) return false;
            const r = await fetch('/api/bookmarks?uid=' + currentUser.uid);
            const d = await r.json();
            return d.data?.some(b => b.url === url) || false;
        }

        async function toggleBookmark() {
            if (!currentUser) return alert('Login dulu!');
            const isBm = await isBookmark(komikUrl);
            await fetch(isBm ? '/api/bookmarks/remove' : '/api/bookmarks/add', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uid: currentUser.uid, url: komikUrl, title: komikTitle })
            });
            location.reload();
        }

        async function loadComments() {
            const r = await fetch('/api/comments?url=' + encodeURIComponent(komikUrl));
            const d = await r.json();
            if (d.success) {
                document.getElementById('count-like').textContent = d.reacts.like || 0;
                document.getElementById('count-love').textContent = d.reacts.love || 0;
                document.getElementById('count-fire').textContent = d.reacts.fire || 0;
                document.getElementById('commentList').innerHTML = (d.data || []).map(c => `
                    <div class="comment-item">
                        <div class="c-header">
                            ${c.avatar ? `<img src="${c.avatar}" class="c-avatar">` : ''}
                            <span class="c-name">${c.name || 'Anonim'}</span>
                            <span class="c-date">${new Date(c.date).toLocaleDateString('id-ID')}</span>
                        </div>
                        <div class="c-text">${c.text}</div>
                    </div>
                `).join('');
            }
        }

        async function sendReact(type) {
            if (!currentUser) return alert('Login dulu!');
            const r = await fetch('/api/react', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ url:komikUrl, uid:currentUser.uid, type }) });
            const d = await r.json();
            if (d.success) {
                document.getElementById('count-like').textContent = d.reacts.like || 0;
                document.getElementById('count-love').textContent = d.reacts.love || 0;
                document.getElementById('count-fire').textContent = d.reacts.fire || 0;
            }
        }

        async function sendComment() {
            if (!currentUser) return alert('Login dulu!');
            const text = document.getElementById('commentText').value.trim();
            if (!text) return;
            await fetch('/api/comments/add', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ url:komikUrl, uid:currentUser.uid, name:currentUser.displayName, avatar:currentUser.photoURL, text }) });
            document.getElementById('commentText').value = '';
            loadComments();
        }

        if (komikUrl) loadDetail();
    </script>
</body>
</html>
