<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baca — Zeon Komik</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#000a1a; --panel:#001030; --border:#002255; --text:#ddeeff; --dim:#4a80b8; --accent:#1e90ff; --accent2:#00bfff; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Poppins',sans-serif; min-height:100vh; }
        .navbar { background:rgba(0,10,30,0.9); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
        .navbar .logo { font-family:'Orbitron',monospace; font-size:1rem; font-weight:900; background:linear-gradient(135deg, var(--accent2), var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent; }
        .navbar a { color:var(--dim); text-decoration:none; font-size:0.75rem; font-weight:600; }
        .container { max-width:800px; margin:0 auto; padding:10px 16px 80px; }
        .top-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
        .top-nav select { padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-family:'Poppins',sans-serif; font-size:0.75rem; max-width:200px; outline:none; }
        .top-nav select:focus { border-color:var(--accent2); }
        .btn { padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; font-weight:600; font-size:0.7rem; font-family:'Poppins',sans-serif; transition:all 0.2s; text-decoration:none; display:inline-block; white-space:nowrap; }
        .btn:hover { background:var(--accent); color:white; border-color:var(--accent); }
        .btn.active { background:var(--accent2); color:var(--bg); border-color:var(--accent2); }
        .progress-bar { width:100%; height:3px; background:var(--border); position:fixed; top:0; left:0; z-index:101; }
        .progress-fill { height:100%; background:var(--accent2); width:0%; transition:width 0.2s; }
        .images img { width:100%; max-width:100%; height:auto; display:block; border-radius:0; margin-bottom:0; object-fit:contain; }
        .loading { text-align:center; padding:40px; color:var(--dim); }
        .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(0,10,30,0.95); backdrop-filter:blur(20px); border-top:1px solid var(--border); padding:10px 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; z-index:100; }
        .bottom-nav .btn { flex:1; text-align:center; }
        .bottom-nav .btn:disabled { opacity:0.4; cursor:not-allowed; }
        .chapter-modal { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,15,0.9); justify-content:center; align-items:center; padding:20px; }
        .chapter-modal.open { display:flex; }
        .chapter-modal .box { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px; width:100%; max-width:450px; max-height:80vh; overflow-y:auto; position:relative; }
        .chapter-modal .box h3 { font-family:'Orbitron',monospace; color:var(--accent2); margin-bottom:12px; font-size:0.9rem; }
        .chapter-modal .close { position:absolute; top:10px; right:16px; background:none; border:none; color:var(--dim); font-size:1.3rem; cursor:pointer; }
        .chapter-item { padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; font-size:0.8rem; display:flex; justify-content:space-between; align-items:center; transition:all 0.2s; }
        .chapter-item:hover { background:rgba(0,180,255,0.1); }
        .chapter-item.read { color:var(--dim); }
        .chapter-item.read::after { content:'✅'; font-size:0.7rem; }
        .chapter-item.current { color:var(--accent2); font-weight:700; background:rgba(0,180,255,0.1); }
        .footer { text-align:center; padding:20px; color:var(--dim); font-size:0.65rem; }
        .footer a { color:var(--accent2); text-decoration:none; }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    
    <nav class="navbar">
        <div class="logo">📚 ZEON KOMIK</div>
        <a href="/">Home</a>
    </nav>

    <div class="container">
        <div class="top-nav">
            <select id="chapterSelect" onchange="jumpChapter()"></select>
            <button class="btn" onclick="openChapterList()">📋 Daftar Chapter</button>
        </div>
        <div class="images" id="content"></div>
        <div class="loading" id="loading">Loading...</div>
    </div>

    <div class="bottom-nav" id="bottomNav">
        <button class="btn" id="btnPrev" onclick="prevChapter()" disabled>⬅ Prev</button>
        <button class="btn" onclick="openChapterList()" style="flex:1.5">📋 Chapter</button>
        <button class="btn" id="btnNext" onclick="nextChapter()" disabled>Next ➡</button>
    </div>

    <div class="chapter-modal" id="chapterModal">
        <div class="box">
            <button class="close" onclick="closeChapterList()">&times;</button>
            <h3>📋 Daftar Chapter</h3>
            <div id="chapterList"></div>
        </div>
    </div>

    <div class="footer">© 2026 <strong>Zeon Komik</strong> — Created by <a href="/about">Ryzen Official</a></div>

    <script>
        const params = new URLSearchParams(location.search);
        const komikUrl = params.get('url');
        const komikTitle = params.get('title') || 'Komik';
        let allChapters = [];
        let currentIndex = -1;

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const progress = docHeight > 0 ? Math.min(100, (scrollTop / docHeight) * 100) : 0;
            document.getElementById('progressFill').style.width = progress + '%';
            if (progress > 90 && currentIndex >= 0) markRead(allChapters[currentIndex].url);
        });

        function markRead(url) {
            let read = JSON.parse(localStorage.getItem('zeon_read') || '[]');
            if (!read.includes(url)) {
                read.push(url);
                localStorage.setItem('zeon_read', JSON.stringify(read));
            }
        }

        function isRead(url) {
            const read = JSON.parse(localStorage.getItem('zeon_read') || '[]');
            return read.includes(url);
        }

        async function loadChapters() {
            try {
                const r = await fetch('/api/detail?url=' + encodeURIComponent(komikUrl));
                const d = await r.json();
                if (d.success && d.data.chapters.length) {
                    allChapters = d.data.chapters;
                    const currentCh = params.get('ch') || allChapters[0].url;
                    currentIndex = allChapters.findIndex(c => c.url === decodeURIComponent(currentCh));
                    if (currentIndex < 0) currentIndex = 0;
                    renderChapterSelect();
                    loadImages(allChapters[currentIndex].url);
                    updateNavButtons();
                }
            } catch(e) { document.getElementById('chapterSelect').innerHTML = '<option>Gagal memuat</option>'; }
        }

        function renderChapterSelect() {
            const sel = document.getElementById('chapterSelect');
            sel.innerHTML = allChapters.map((c, i) => 
                `<option value="${i}" ${i === currentIndex ? 'selected' : ''}>${c.title}</option>`
            ).join('');
        }

        function jumpChapter() {
            const idx = parseInt(document.getElementById('chapterSelect').value);
            if (idx !== currentIndex) {
                currentIndex = idx;
                loadImages(allChapters[currentIndex].url);
                updateNavButtons();
                renderChapterSelect();
                window.scrollTo(0, 0);
            }
        }

        function prevChapter() {
            if (currentIndex > 0) {
                currentIndex--;
                loadImages(allChapters[currentIndex].url);
                updateNavButtons();
                renderChapterSelect();
                window.scrollTo(0, 0);
            }
        }

        function nextChapter() {
            if (currentIndex < allChapters.length - 1) {
                currentIndex++;
                loadImages(allChapters[currentIndex].url);
                updateNavButtons();
                renderChapterSelect();
                window.scrollTo(0, 0);
            }
        }

        function updateNavButtons() {
            document.getElementById('btnPrev').disabled = currentIndex <= 0;
            document.getElementById('btnNext').disabled = currentIndex >= allChapters.length - 1;
        }

        function openChapterList() {
            const modal = document.getElementById('chapterModal');
            const list = document.getElementById('chapterList');
            list.innerHTML = allChapters.map((c, i) => `
                <div class="chapter-item ${i === currentIndex ? 'current' : ''} ${isRead(c.url) ? 'read' : ''}" 
                     onclick="goToChapter(${i})">
                    <span>${c.title}</span>
                </div>
            `).join('');
            modal.classList.add('open');
        }

        function closeChapterList() {
            document.getElementById('chapterModal').classList.remove('open');
        }

        function goToChapter(idx) {
            currentIndex = idx;
            loadImages(allChapters[currentIndex].url);
            updateNavButtons();
            renderChapterSelect();
            closeChapterList();
            window.scrollTo(0, 0);
        }

        async function loadImages(url) {
            const content = document.getElementById('content');
            const load = document.getElementById('loading');
            content.innerHTML = '';
            load.style.display = 'block';
            document.getElementById('progressFill').style.width = '0%';

            try {
                const r = await fetch('/api/read?url=' + encodeURIComponent(url));
                const d = await r.json();
                if (d.success && d.data.images.length) {
                    content.innerHTML = d.data.images.map(img => 
                        `<img src="${img}" alt="page" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'" onload="this.style.opacity='1'" style="opacity:0;transition:opacity 0.3s">`
                    ).join('');
                } else {
                    content.innerHTML = '<p style="color:var(--dim);text-align:center;padding:40px">Gambar tidak tersedia.</p>';
                }
            } catch(e) {
                content.innerHTML = '<p style="color:var(--dim);text-align:center;padding:40px">Gagal memuat.</p>';
            }
            load.style.display = 'none';
            window.scrollTo(0, 0);
        }

        if (komikUrl) loadChapters();
    </script>
</body>
</html>
